<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Security Console</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 340px; background: #12151c; border: 1px solid #262b36; border-radius: 10px; padding: 32px; }
  .login-box h1 { font-size: 18px; margin: 0 0 4px; color: #fff; }
  .login-box p { font-size: 13px; color: #8891a3; margin: 0 0 20px; }
  .login-box input { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 10px 12px;
    background: #0c0e13; border: 1px solid #2a2f3a; border-radius: 6px; color: #fff; font-size: 14px; }
  .login-box button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #14b8a6;
    color: #06201c; font-weight: 600; cursor: pointer; }
  .login-error { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 16px; }
  .hint { margin-top: 16px; font-size: 12px; color: #5c6577; }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>Security Console</h1>
      <p>RBAC · SoD Simulator — sign in to continue</p>
      <form id="login-form">
        <input name="username" placeholder="Username" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
      <div class="hint">Demo credentials: admin / admin123</div>
    </div>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(fd))
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Login failed');
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = err.message;
  }
});
</script>
</body>
</html>
